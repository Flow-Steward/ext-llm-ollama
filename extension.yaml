manifest_version: 2
lifecycle: {data_schema_version: 1, data_migrations: []}
extension_id: flowsteward.ollama-remote
kind: tool_provider
version: 1.2.3
release_stage: active
display_name: Ollama LLM Provider
description: |-
  Run Flow Steward agents with models from Ollama's hosted API or an Ollama server you operate using Ollama LLM Provider. Discover the server's models, select the ones you need and add those that pass Flow Steward's capability verification to the model catalog. You can then choose a model for an agent or use it as a project's default.

  The provider uses Ollama's model-list, model-information and chat APIs. It supports conversations, tool calls with result replay, and schema-guided structured responses. Structured responses use a forced-tool approach, with the local Ollama format option supplied as well. Returned messages, tool calls and usage information are passed back to Flow Steward.

  Use it when you want agents backed by Ollama cloud models or by models running on your own infrastructure. The extension does not install Ollama or download model weights. Models must meet Flow Steward's chat, tool-use and structured-output requirements; appearing in discovery does not guarantee enablement. Hosted access depends on your API key, plan and quota. A private server must be reachable from Flow Steward's runtime and permitted by the host's network policy.
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-llm-ollama/issues
  website_url: https://github.com/Flow-Steward/ext-llm-ollama
listing:
  category: ai
  tags:
  - llm
  - ollama
  summary: Add hosted or self-hosted Ollama models to Flow Steward agents with model discovery, tool calling and
    structured responses.
  setup_summary: For hosted Ollama, enter the complete API key in the account-scoped LLM provider panel and leave
    the Base URL empty. For your own server, enter its reachable base URL, supply a key if it requires one, and
    enable the host's private-address policy when needed; then discover and verify models.
features:
  - tool
  - llm_provider
required_scopes:
  - extension:invoke
machine_auth:
  service_account_key: svc_ext_ollama_remote
  required_scopes:
    - extension:invoke
account_scope:
  scope_type: account
  description: Ollama provider settings are account-scoped.
entrypoint:
  mode: subprocess
  command:
    - python3
    - main.py
  timeout_seconds: 120
health:
  command:
    - python3
    - health.py
  timeout_seconds: 5
ui_manifest: ui/ui_manifest.yaml
python_requirements: []
runtime:
  contract_version: extension_host_v2
  compatibility:
    platform_min: 1.3.0
  extension_contract_v2:
    llm_provider:
      schema_version: llm_provider_extension_v1
      supplier_key: ollama_remote
      supplier_label: Ollama
      runtime_mode: subprocess
      credential_provider_key: ollama_remote
      required_provider_secrets: []
      optional_provider_secrets:
        - api_key
      required_connection_config: []
      optional_connection_config:
        - upstream_base_url
      # What an empty Base URL means. The host compares effective settings, so
      # clearing the field while it holds this value keeps verified models.
      connection_config_defaults:
        upstream_base_url: https://ollama.com
      # Shown under each field in Flow Steward's provider settings (contract 1.3.0).
      connection_config_help:
        upstream_base_url: "Leave empty for Ollama's hosted API. For your own Ollama server, its address only, without /api or /v1 (for example http://192.168.1.20:11434)."
      provider_secret_help:
        api_key: "Needed for ollama.com. Copy the whole key from ollama.com/settings/keys with its copy button: it is two parts joined by a dot."
      operations:
        list_models:
          query_id: llm.list_models
        chat:
          action_id: llm.chat
        structured_chat:
          action_id: llm.chat_structured
          optional: true
      model_grouping:
        strategy: endpoint
        owner_key_field: upstream_owner_key
        owner_label_field: upstream_owner_label
      required_capabilities_for_enablement:
        - chat
        - tools
        - structured_output
