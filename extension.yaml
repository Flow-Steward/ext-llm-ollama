manifest_version: 2
lifecycle: {data_schema_version: 1, data_migrations: []}
extension_id: flowsteward.ollama-remote
kind: tool_provider
version: 1.1.0
release_stage: active
display_name: Ollama LLM Provider
description: Use models from Ollama's hosted API, or from your own Ollama server, in Flow Steward agents.
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-llm-ollama/issues
  website_url: https://github.com/Flow-Steward/ext-llm-ollama
listing:
  category: ai
  tags:
    - llm
    - ollama
  summary: Connect Ollama with an API key, load its model list, and add models to the Flow Steward model catalog.
features:
  - tool
  - llm_provider
required_scopes:
  - extension:invoke
machine_auth:
  service_account_key: svc_ext_ollama_remote
  required_scopes:
    - extension:invoke
account_scope:
  scope_type: account
  description: Ollama provider settings are account-scoped.
entrypoint:
  mode: subprocess
  command:
    - python3
    - main.py
  timeout_seconds: 120
health:
  command:
    - python3
    - health.py
  timeout_seconds: 5
ui_manifest: ui/ui_manifest.yaml
python_requirements: []
runtime:
  contract_version: extension_host_v1
  compatibility:
    platform_min: 1.1.0
  extension_contract_v2:
    llm_provider:
      schema_version: llm_provider_extension_v1
      supplier_key: ollama_remote
      supplier_label: Ollama
      runtime_mode: subprocess
      credential_provider_key: ollama_remote
      required_provider_secrets: []
      optional_provider_secrets:
        - api_key
      required_connection_config: []
      optional_connection_config:
        - upstream_base_url
      operations:
        list_models:
          query_id: llm.list_models
        chat:
          action_id: llm.chat
        structured_chat:
          action_id: llm.chat_structured
          optional: true
      model_grouping:
        strategy: endpoint
        owner_key_field: upstream_owner_key
        owner_label_field: upstream_owner_label
      required_capabilities_for_enablement:
        - chat
        - tools
        - structured_output
