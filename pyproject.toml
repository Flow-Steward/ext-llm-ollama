[project]
name = "flowsteward-ollama-llm-provider"
version = "1.2.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".fs-python", "dev-wheels", "wheels"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# The shared release scripts keep a few long message strings.
per-file-ignores = { ".github/scripts/*.py" = ["E501"] }

# The Flow Steward extension gate runs mypy from this folder: the SDK wheel is
# untyped, and modules are named from this folder (it has an __init__.py).
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
exclude = "(^\\.fs-python/|^dev-wheels/|^wheels/)"
