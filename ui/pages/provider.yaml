page_id: provider
title: Ollama
description: Connect Ollama in the LLM provider panel on this page. Enter an API key for Ollama's hosted API, or a base URL (and a key if it needs one) for your own Ollama server. An Ollama on the machine running Flow Steward is http://host.docker.internal:11434, not localhost; a private address needs an administrator to allow it, preferably just that server with FS_ALLOWED_PRIVATE_ORIGINS=http://host.docker.internal:11434. Then discover models and add the ones you want.
